<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RESTU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#030307;--card:rgba(255,255,255,.045);--line:rgba(255,255,255,.09);--txt:#e6e6ea;--mute:#5d5d66;--ico:#8b8b93;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--txt);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg svg{position:absolute;inset:-10%;width:120%;height:120%;filter:blur(14px);opacity:.9;animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-2%,-1%,0) scale(1)}to{transform:translate3d(2%,2%,0) scale(1.06)}}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,transparent 30%,rgba(0,0,3,.65))}

/* splash */
#splash{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(3,3,7,.35);cursor:pointer;transition:opacity .7s ease,visibility .7s}
#splash.hide{opacity:0;visibility:hidden}
.glass{width:100%;max-width:430px;padding:46px 20px 40px;border:1px solid var(--line);border-radius:26px;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);text-align:center}
.glass .mark{width:84px;height:84px;margin:0 auto 14px;opacity:.75}
.glass .pe{font-size:16px;letter-spacing:.06em;color:#6d6d75;font-weight:500}
.tap{display:flex;align-items:center;gap:14px;margin-top:34px;color:#4d4d55;font-size:12px;letter-spacing:.38em;font-weight:500}
.tap::before,.tap::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.1)}

/* sound */
#snd{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));right:max(18px,calc(50% - 232px));z-index:30;width:54px;height:54px;border-radius:50%;border:0;background:rgba(255,255,255,.05);color:#7c7c85;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(8px)}
#snd svg{width:24px;height:24px}
#snd.off .waves{display:none}

/* page */
main{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:28px 18px 56px;display:flex;flex-direction:column;align-items:center;opacity:0;transform:translateY(8px);transition:opacity .8s .15s,transform .8s .15s}
main.show{opacity:1;transform:none}
.avatar{width:84px;height:84px;margin-top:22px;border-radius:50%;background:radial-gradient(circle,#15151b,#0a0a0f);border:1px solid rgba(255,255,255,.05);display:grid;place-items:center;box-shadow:0 0 40px rgba(0,0,0,.6)}
.avatar svg{width:50px;height:50px;opacity:.7}
h1{margin:22px 0 0;font-size:30px;font-weight:800;color:#8e8e96;letter-spacing:-.01em}
.bio{margin:14px 0 0;font-size:14px;color:#4a4a52;font-weight:500;text-align:center}
.soc{display:flex;gap:28px;margin:28px 0 0}
.soc a{color:#6f6f78;display:grid;place-items:center;width:42px;height:42px;transition:color .2s,transform .2s}
.soc a:hover,.soc a:focus-visible{color:#c9c9d0;transform:translateY(-2px);outline:0}
.soc svg{width:36px;height:36px}
.links{width:100%;display:flex;flex-direction:column;gap:16px;margin-top:40px}
.link{display:flex;align-items:center;gap:16px;padding:16px 18px;min-height:82px;border:1px solid var(--line);border-radius:18px;background:var(--card);color:inherit;text-decoration:none;transition:background .2s,border-color .2s,transform .15s}
.link:hover,.link:focus-visible{background:rgba(255,255,255,.075);border-color:rgba(255,255,255,.16);outline:0}
.link:active{transform:scale(.985)}
.lic{flex:0 0 46px;width:46px;height:46px;display:grid;place-items:center;border-radius:50%}
.lic svg{width:32px;height:32px}
.txt{flex:1;min-width:0}
.txt b{display:block;font-size:17px;font-weight:700;color:#8a8a92;letter-spacing:.005em}
.txt span{display:block;margin-top:3px;font-size:12.5px;line-height:1.35;color:#4f4f57;font-weight:500}
.ext{flex:0 0 24px;width:24px;height:24px;color:#6a6a73}
@media (prefers-reduced-motion:reduce){.bg svg{animation:none}main,#splash{transition:none}}
</style>
</head>

<script>
(function(){
  var splash=document.getElementById('splash'),page=document.getElementById('page'),snd=document.getElementById('snd');
  function enter(){
    if(splash.classList.contains('hide'))return;
    splash.classList.add('hide');
    page.classList.add('show');
  }
  splash.addEventListener('click',enter);
  splash.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();enter();}});
  snd.addEventListener('click',function(){
    var off=snd.classList.toggle('off');
    snd.setAttribute('aria-pressed',String(!off));
  });
})();
</script>
